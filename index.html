<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>দোকান ম্যানেজমেন্ট সফটওয়্যার - POS & ERP</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@300;400;500;600;700&display=swap');
        body { font-family: 'Hind Siliguri', sans-serif; }
        @media print {
            .no-print { display: none !important; }
            .print-only { display: block !important; }
        }
    </style>
</head>
<body class="bg-slate-100 text-slate-800 antialiased min-h-screen flex flex-col">

    <!-- Top Navbar -->
    <header class="bg-indigo-900 text-white shadow-md sticky top-0 z-50 no-print">
        <div class="max-w-7xl mx-auto px-4 py-3 flex justify-between items-center">
            <div class="flex items-center gap-3">
                <i class="fa-solid me-1 fa-shop text-2xl text-amber-400"></i>
                <h1 class="text-xl font-bold tracking-wide">আখন্দ পোল্ট্রি ফিড ও স্টোর</h1>
            </div>
            <div class="flex items-center gap-4 text-sm">
                <span class="hidden md:inline bg-indigo-800 px-3 py-1 rounded-full"><i class="fa-regular fa-clock me-1"></i> <span id="clock"></span></span>
                <button onclick="exportData()" class="bg-amber-500 hover:bg-amber-600 text-slate-900 font-bold px-3 py-1.5 rounded text-xs flex items-center gap-1">
                    <i class="fa-solid fa-download"></i> ব্যাকআপ
                </button>
            </div>
        </div>
    </header>

    <div class="flex-1 flex max-w-7xl w-full mx-auto my-4 gap-4 px-2 md:px-4">
        
        <!-- Sidebar Navigation -->
        <aside class="w-16 md:w-64 bg-white rounded-xl shadow-sm p-2 md:p-4 flex flex-col gap-2 no-print shrink-0">
            <nav class="space-y-1">
                <button onclick="switchTab('dashboard')" class="nav-btn active w-full flex items-center gap-3 px-3 py-2.5 rounded-lg text-slate-600 hover:bg-indigo-50 hover:text-indigo-600 font-medium transition text-left">
                    <i class="fa-solid fa-chart-pie text-lg w-6"></i>
                    <span class="hidden md:inline">ড্যাশবোর্ড</span>
                </button>
                <button onclick="switchTab('pos')" class="nav-btn w-full flex items-center gap-3 px-3 py-2.5 rounded-lg text-slate-600 hover:bg-indigo-50 hover:text-indigo-600 font-medium transition text-left">
                    <i class="fa-solid fa-cart-shopping text-lg w-6"></i>
                    <span class="hidden md:inline">বিক্রি / POS</span>
                </button>
                <button onclick="switchTab('products')" class="nav-btn w-full flex items-center gap-3 px-3 py-2.5 rounded-lg text-slate-600 hover:bg-indigo-50 hover:text-indigo-600 font-medium transition text-left">
                    <i class="fa-solid fa-boxes-stacked text-lg w-6"></i>
                    <span class="hidden md:inline">প্রোডাক্ট ও স্টক</span>
                </button>
                <button onclick="switchTab('customers')" class="nav-btn w-full flex items-center gap-3 px-3 py-2.5 rounded-lg text-slate-600 hover:bg-indigo-50 hover:text-indigo-600 font-medium transition text-left">
                    <i class="fa-solid fa-users text-lg w-6"></i>
                    <span class="hidden md:inline">কাস্টমার খাতা</span>
                </button>
                <button onclick="switchTab('expenses')" class="nav-btn w-full flex items-center gap-3 px-3 py-2.5 rounded-lg text-slate-600 hover:bg-indigo-50 hover:text-indigo-600 font-medium transition text-left">
                    <i class="fa-solid fa-receipt text-lg w-6"></i>
                    <span class="hidden md:inline">খরচ খাতা</span>
                </button>
                <button onclick="switchTab('reports')" class="nav-btn w-full flex items-center gap-3 px-3 py-2.5 rounded-lg text-slate-600 hover:bg-indigo-50 hover:text-indigo-600 font-medium transition text-left">
                    <i class="fa-solid fa-file-invoice-dollar text-lg w-6"></i>
                    <span class="hidden md:inline">লাভ-ক্ষতি ও রিপোর্ট</span>
                </button>
            </nav>
        </aside>

        <!-- Main Content Area -->
        <main class="flex-1 bg-white rounded-xl shadow-sm p-4 md:p-6 overflow-x-hidden">
            
            <!-- Alert Center -->
            <div id="alertsContainer" class="mb-6 space-y-2 no-print"></div>

            <!-- TAB 1: Dashboard -->
            <section id="tab-dashboard" class="tab-content">
                <h2 class="text-xl font-bold mb-4 text-slate-800 flex items-center gap-2">
                    <i class="fa-solid fa-gauge-high text-indigo-600"></i> ওভারভিউ
                </h2>
                
                <!-- KPI Cards Grid -->
                <div class="grid grid-cols-2 md:grid-cols-4 gap-4 mb-6">
                    <div class="bg-indigo-50 p-4 rounded-xl border border-indigo-100">
                        <p class="text-xs font-semibold text-indigo-600 uppercase">আজকের বিক্রি</p>
                        <h3 class="text-2xl font-bold text-indigo-900 mt-1">৳<span id="dashTodaySales">0</span></h3>
                    </div>
                    <div class="bg-emerald-50 p-4 rounded-xl border border-emerald-100">
                        <p class="text-xs font-semibold text-emerald-600 uppercase">আজকের আদায়</p>
                        <h3 class="text-2xl font-bold text-emerald-900 mt-1">৳<span id="dashTodayCollection">0</span></h3>
                    </div>
                    <div class="bg-amber-50 p-4 rounded-xl border border-amber-100">
                        <p class="text-xs font-semibold text-amber-600 uppercase">আজকের বাকি</p>
                        <h3 class="text-2xl font-bold text-amber-900 mt-1">৳<span id="dashTodayDue">0</span></h3>
                    </div>
                    <div class="bg-rose-50 p-4 rounded-xl border border-rose-100">
                        <p class="text-xs font-semibold text-rose-600 uppercase">মোট খাতা বাকি</p>
                        <h3 class="text-2xl font-bold text-rose-900 mt-1">৳<span id="dashTotalDue">0</span></h3>
                    </div>
                </div>

                <div class="grid grid-cols-2 md:grid-cols-3 gap-4 mb-6">
                    <div class="bg-slate-50 p-4 rounded-xl border border-slate-200">
                        <p class="text-xs font-medium text-slate-500">মোট স্টক ভ্যালু</p>
                        <h4 class="text-xl font-bold text-slate-700 mt-1">৳<span id="dashStockValue">0</span></h4>
                    </div>
                    <div class="bg-slate-50 p-4 rounded-xl border border-slate-200">
                        <p class="text-xs font-medium text-slate-500">ক্যাশ ইন হ্যান্ড (ক্যাশ আদায় - খরচ)</p>
                        <h4 class="text-xl font-bold text-slate-700 mt-1">৳<span id="dashCashInHand">0</span></h4>
                    </div>
                    <div class="bg-teal-50 p-4 rounded-xl border border-teal-200 col-span-2 md:col-span-1">
                        <p class="text-xs font-medium text-teal-700">আজকের আনুমানিক নেট লাভ</p>
                        <h4 class="text-xl font-bold text-teal-900 mt-1">৳<span id="dashNetProfit">0</span></h4>
                    </div>
                </div>

                <!-- Sales Chart -->
                <div class="bg-white border rounded-xl p-4 mb-6">
                    <h3 class="text-md font-bold mb-3 text-slate-700">বিক্রির চিত্রলেখ (Sales Chart)</h3>
                    <canvas id="salesChart" height="100"></canvas>
                </div>
            </section>

            <!-- TAB 2: POS / Sales Entry -->
            <section id="tab-pos" class="tab-content hidden">
                <h2 class="text-xl font-bold mb-4 text-slate-800 flex items-center gap-2">
                    <i class="fa-solid fa-cart-shopping text-indigo-60
